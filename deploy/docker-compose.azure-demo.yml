# Demo en Azure: base de datos, API y web (con HTTPS) en una sola máquina virtual pequeña
# (B2ats v2: 2 vCPU, 1 GB + swap). PostgreSQL va ajustado para poca memoria.
# Uso (en la máquina virtual, dentro de la carpeta del proyecto):
#   cp deploy/.env.azure-demo.example deploy/.env      y completa los valores
#   docker compose -f deploy/docker-compose.azure-demo.yml --env-file deploy/.env up -d --build
# Guía: docs/DEPLOY-AZURE-DEMO.md

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
      - -c
      - effective_cache_size=256MB
    environment:
      POSTGRES_USER: uywasys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: uywasys
      TZ: America/Lima
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uywasys -d uywasys"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://uywasys:${POSTGRES_PASSWORD}@db:5432/uywasys
      CORS_ORIGIN: https://${DOMAIN:?Define DOMAIN en deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en deploy/.env}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      BILLING_SECRET: ${BILLING_SECRET:-}
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
