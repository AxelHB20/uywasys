# Producción: base de datos, API, web con HTTPS y respaldo diario.
# Uso (en el servidor, dentro de la carpeta del proyecto):
#   cp deploy/.env.example deploy/.env      y completa los valores
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Guía completa: docs/DEPLOY.md

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Estadísticas de consultas (para la revisión semanal de rendimiento) y registro de las que
    # tardan más de 1 s con su plan, sin los valores (datos de clientes): docker compose logs db.
    # Memoria pensada para un VPS de 8 GB que comparte con la API y la web.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_parameter_max_length=0
      - -c
      - auto_explain.log_min_duration=1000
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
    shm_size: 256mb
    environment:
      POSTGRES_USER: uywasys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: uywasys
      TZ: America/Lima
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uywasys -d uywasys"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://uywasys:${POSTGRES_PASSWORD}@db:5432/uywasys
      CORS_ORIGIN: https://${DOMAIN:?Define DOMAIN en deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en deploy/.env}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
      API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      SEED_CLINIC_NAME: ${SEED_CLINIC_NAME:-Mi veterinaria}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # Cifra el token del PSE; si queda vacío se usa JWT_SECRET
      BILLING_SECRET: ${BILLING_SECRET:-}
      # Producción: sin comprobantes simulados (sin valor tributario). true solo para pruebas.
      BILLING_ALLOW_SIMULATED: ${BILLING_ALLOW_SIMULATED:-false}
      # "¿Olvidaste tu contraseña?": correo de la clínica (Gmail + contraseña de aplicación). Vacío = apagado.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: https://${DOMAIN}
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # Respaldo diario incremental y cifrado (03:15, hora de Lima), fuera del servidor con rclone.
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: uywasys
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: uywasys
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:?Define BACKUP_PASSWORD en deploy/.env (contraseña que cifra los respaldos)}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-30}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      PERF_PING_URL: ${PERF_PING_URL:-}
      PERF_SLOW_MS: ${PERF_SLOW_MS:-300}
      TZ: America/Lima
    volumes:
      - backups:/backups
      - ./backup/rclone:/config/rclone:ro
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
  backups:
