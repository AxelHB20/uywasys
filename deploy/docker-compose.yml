# Producción: base de datos, API, web con HTTPS y respaldo diario.
# Uso (en el servidor, dentro de la carpeta del proyecto):
#   cp deploy/.env.example deploy/.env      y completa los valores
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Guía completa: docs/DEPLOY.md

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uywasys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: uywasys
      TZ: America/Lima
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uywasys -d uywasys"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://uywasys:${POSTGRES_PASSWORD}@db:5432/uywasys
      CORS_ORIGIN: https://${DOMAIN:?Define DOMAIN en deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en deploy/.env}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
      API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      SEED_CLINIC_NAME: ${SEED_CLINIC_NAME:-Mi veterinaria}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # Cifra el token del PSE; si queda vacío se usa JWT_SECRET
      BILLING_SECRET: ${BILLING_SECRET:-}
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # Respaldo diario cifrado (03:15, hora de Lima) y copia fuera del servidor con rclone.
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: uywasys
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: uywasys
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?Define BACKUP_AGE_RECIPIENT en deploy/.env (clave pública de age)}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      TZ: America/Lima
    volumes:
      - backups:/backups
      - ./backup/rclone:/config/rclone:ro
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
  backups:
