# Base de datos para desarrollo. Levantar con: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: uywasys-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: uywasys
      POSTGRES_PASSWORD: uywasys
      POSTGRES_DB: uywasys
      TZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      - uywasys-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uywasys -d uywasys"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uywasys-db:
